<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>ERP software logo</title>
  <desc>Abstract mark of three interlocking rounded squares in navy, teal, and amber, representing connected modules, above the wordmark ERP.</desc>

  <g transform="translate(320,140)">
    <rect x="-90" y="-90" width="110" height="110" rx="20" fill="#0F3D5C" opacity="0.92"/>
    <rect x="-20" y="-90" width="110" height="110" rx="20" fill="#12849E" opacity="0.92"/>
    <rect x="-55" y="-20" width="110" height="110" rx="20" fill="#F0A63B" opacity="0.95"/>
  </g>

  <text x="320" y="300" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="6" fill="#0F3D5C">ERP</text>
  <text x="320" y="330" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="3" fill="#5B7A8C">CONNECTED BUSINESS SUITE</text>
</svg>
